name: Nightly Race Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pull-request race suite run twice in one process, so a test that only
  # fails on a repeat shows up across the two runs.
  race-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zsh and fish for the shell tests
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish

      - name: make test-race at -count=2
        run: make test-race
        env:
          GOFLAGS: "-count=2"
